# Alembic configuration for superconductor-db.
#
# DSN is read at runtime from the application's Settings (see env.py); we do
# NOT set `sqlalchemy.url` here so production / test DSNs are not duplicated.

[alembic]
script_location = alembic
prepend_sys_path = src
timezone = UTC
truncate_slug_length = 40
revision_environment = false
sourceless = false

# File template for new revisions.
file_template = %%(rev)s_%%(slug)s

# Set in [loggers] section; logging defaults here are minimal.
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
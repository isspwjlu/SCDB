[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superconductor-db"
version = "0.1.0"
description = "Research-grade superconductor database backend (FastAPI + SQLAlchemy 2 + Alembic + Pydantic v2)."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.110,<0.120",
    "uvicorn[standard]>=0.27,<0.30",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<0.30",
    "psycopg[binary]>=3.1,<4",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "bcrypt<4.1",
    "httpx>=0.27,<0.30",
    "minio>=7.2,<8",
    # The nickelate pressure data comes from a workbook, not from a CSV.
    "openpyxl>=3.1,<4",
    # PDF parsing uses docling, which lives in its own virtualenv
    # (backend/.venv-docling) -- see docs/development.md.
    "python-multipart>=0.0.6",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=4.1,<6",
    "testcontainers[postgres]>=4.7,<5",
    "ruff>=0.3,<1",
    "mypy>=1.8,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The coverage gate is enforced on every run. The threshold is the project's
# real measured level (see docs/development.md) — raise it as ingest-loop tests
# are added, rather than leaving a documented 80% that nothing enforces.
addopts = "-ra --strict-markers --cov=superconductor_db --cov-report=term-missing --cov-fail-under=55"
markers = [
    "unit: pure unit tests, no DB/external services",
    "integration: integration tests requiring DB/services",
]

[tool.coverage.run]
source = ["superconductor_db"]
omit = ["*/__pycache__/*", "*/alembic/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
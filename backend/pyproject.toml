[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superconductor-db"
version = "0.1.0"
description = "Research-grade superconductor database backend (FastAPI + SQLAlchemy 2 + Alembic + Pydantic v2)."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.110,<0.120",
    "uvicorn[standard]>=0.27,<0.30",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<0.30",
    "psycopg[binary]>=3.1,<4",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "bcrypt<4.1",
    "httpx>=0.27,<0.30",
    "minio>=7.2,<8",
    "pymupdf>=1.24,<2",
    "python-multipart>=0.0.6",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=4.1,<6",
    "testcontainers[postgres]>=4.7,<5",
    "ruff>=0.3,<1",
    "mypy>=1.8,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "unit: pure unit tests, no DB/external services",
    "integration: integration tests requiring DB/services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
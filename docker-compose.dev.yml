services:
  backend:
    build:
      target: dev
    volumes:
      - ./backend/src:/app/src
    command: uvicorn superconductor_db.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend/src:/app/src
    environment:
      VITE_API_PROXY: http://backend:8000

  worker:
    build:
      target: dev
    volumes:
      - ./backend/src:/app/src
    command: python -m superconductor_db.ingest.worker
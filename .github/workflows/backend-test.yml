name: backend-test

# The test suite gate.
# Runs on every PR push and on every direct push to main, and fails the
# build if the backend test suite breaks.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scdb
          POSTGRES_PASSWORD: scdb_dev_pw
          POSTGRES_DB: superconductor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: scdb
      POSTGRES_PASSWORD: scdb_dev_pw
      POSTGRES_DB: superconductor
      PDF_CACHE_DIR: /tmp/pdfs
      MARKDOWN_CACHE_DIR: /tmp/markdown

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend deps
        working-directory: backend
        run: pip install -e .[dev]

      - name: Backend tests
        run: make backend-test
        env:
          POSTGRES_HOST: localhost

name: contract-test

# Contract + suite gate.
# Runs on every PR push and on every direct push to main.
# Fails the build if committed JSON Schemas drift from the current Pydantic
# models, if the backend test suite breaks, or if the frontend test suite
# breaks. See docs/development.md for the full developer workflow.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-and-tests:
    name: contract diff + backend + frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scdb
          POSTGRES_PASSWORD: scdb_dev_pw
          POSTGRES_DB: superconductor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: scdb
          MINIO_ROOT_PASSWORD: scdb_dev_pw
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/ready || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: scdb
      POSTGRES_PASSWORD: scdb_dev_pw
      POSTGRES_DB: superconductor
      MINIO_ROOT_USER: scdb
      MINIO_ROOT_PASSWORD: scdb_dev_pw
      MINIO_BUCKET: scdb-cache
      JWT_SECRET: ci_test_jwt_secret_at_least_64_characters_long_for_acceptance
      JWT_EXPIRY_HOURS: 24
      ALLOW_OPEN_REGISTRATION: "false"
      PDF_CACHE_DIR: /tmp/pdfs
      MARKDOWN_CACHE_DIR: /tmp/markdown

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ---------- Contract diff (the dedicated CI gate) ---------- #
      - name: Install backend deps
        working-directory: backend
        run: pip install -e .[dev]

      - name: Contract diff (committed vs generated JSON Schemas)
        run: python contracts/diff.py --verbose

      # ---------- Backend test suite ---------- #
      - name: Backend tests
        run: make backend-test
        env:
          POSTGRES_HOST: localhost

      # ---------- Frontend test suite ---------- #
      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: npm run test:coverage
